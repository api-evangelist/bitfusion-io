name: Bitfusion Io
description: Bitfusion (bitfusion.io) was an Austin, Texas startup, backed by DCVC, that built
  "elastic AI" infrastructure software. Its FlexDirect platform was a transparent GPU/CPU
  virtualization layer that pooled network-attached accelerators (GPUs, FPGAs, ASICs) across
  TCP, RoCE, and InfiniBand into a single elastic compute cluster for sharing, scaling, and
  management of AI/ML workloads. VMware acquired Bitfusion in 2019 and folded FlexDirect into
  vSphere as vSphere Bitfusion (subsequently end-of-lifed). The independent company no longer
  operates, the bitfusion.io domain no longer resolves, and it exposes no public API, developer
  portal, or discoverable artifacts. Retained here as a DCVC portfolio record; defunct as an
  enrichment lead.
